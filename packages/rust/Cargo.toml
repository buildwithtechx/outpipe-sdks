[package]
name = "outpipe"
version = "0.1.0"
edition = "2021"
description = "Rust client and protocol types for Outpipe"
license = "AGPL-3.0-or-later"
repository = "https://github.com/buildwithtechx/outpipe"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
