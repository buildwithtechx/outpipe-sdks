name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable reproduction.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Tunnel server
        - Tunnel agent
        - CLI
        - Dashboard
        - Desktop app
        - Protocol
        - Self-hosted deployment
        - Outpipe integration
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and environment
      description: Remove tokens, credentials, private URLs, and personal data before submitting.
